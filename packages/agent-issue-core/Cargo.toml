[package]
name = "agent-issue-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
async-trait = "=0.1.89"
base64 = "=0.22.1"
regex = "=1.11.2"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
sha2 = "=0.10.9"
url = "=2.5.7"
wasm-bindgen = "=0.2.126"
web-sys = { version = "=0.3.103", features = ["AbortSignal"] }
worker = "=0.8.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
